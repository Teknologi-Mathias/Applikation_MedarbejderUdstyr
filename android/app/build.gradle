// IN-BASE Klargøring: lille Device Owner-app, der klargør en driftstelefon offline.
// Byg: scripts/byg_klargoering_apk.ps1 (lægger APK'en i assets/mdm/).
plugins {
    id "com.android.application"
}

// Reservekode: nulstiller telefoner, der er klargjort UDEN egen nulstillingskode (før v2).
// Genereres én gang i android/reservekode.txt (ikke i git) og kopieres til assets/mdm/,
// så IN-BASE kan vise den for administratorer.
def reservekodeFil = rootProject.file("reservekode.txt")
if (!reservekodeFil.exists()) {
    reservekodeFil.text = String.format("%08d", new java.security.SecureRandom().nextInt(100000000))
}
def reservekode = reservekodeFil.text.trim()

// Masterkode: virker på ALLE telefoner (v5+) som nulstillingskode – også når telefonens egen
// kode er væk. Kun administratoren, der bygger, kender den: android/masterkode.txt (ikke i git,
// kopieres IKKE til IN-BASE). Byg altid med den samme fil – ellers får nye telefoner en ny kode.
// Kun en PBKDF2-hash lægges i appen, så koden ikke kan læses ud af APK'en.
def masterkodeFil = rootProject.file("masterkode.txt")
if (!masterkodeFil.exists()) {
    def r = new java.security.SecureRandom()
    masterkodeFil.text = (1..16).collect { r.nextInt(10) }.join("")
    println "*** NY MASTERKODE i android/masterkode.txt – gem den et sikkert sted. ***"
}
def masterkode = masterkodeFil.text.trim()
if (!(masterkode ==~ /\d{12,}/)) throw new GradleException("android/masterkode.txt skal være mindst 12 cifre.")
def masterHash = javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
        .generateSecret(new javax.crypto.spec.PBEKeySpec(masterkode.toCharArray(),
                "inbase-master".getBytes("UTF-8"), 120000, 256))
        .encoded.encodeHex().toString()

// Signering: projektets faste nøgle fra Supabase (kun administratorer), hentet af
// scripts/byg_klargoering_apk.ps1 til android/signering/ og slettet igen efter bygget.
// Telefonerne afviser opdateringer signeret med en anden nøgle – derfor ALDRIG debug-nøglen.
def signeringFil = rootProject.file("signering/signering.properties")
def signering = new Properties()
if (signeringFil.exists()) signeringFil.withInputStream { signering.load(it) }
gradle.taskGraph.whenReady { graf ->
    if (!signeringFil.exists() && graf.allTasks.any { it.name == "packageRelease" }) {
        throw new GradleException("Signeringsnøglen mangler. Byg med scripts\\byg_klargoering_apk.ps1 " +
                "(henter nøglen med dit IN-BASE-administratorlogin).")
    }
}

android {
    namespace "dk.instore.inbase.klargoering"
    compileSdk 37

    defaultConfig {
        applicationId "dk.instore.inbase.klargoering"
        minSdk 29          // Android 10+: QR-klargøring med GET_PROVISIONING_MODE
        targetSdk 35
        versionCode 6
        versionName "6.0"
        resValue "string", "reservekode", reservekode
        resValue "string", "master_hash", masterHash
    }

    signingConfigs {
        release {
            if (signeringFil.exists()) {
                storeFile rootProject.file("signering/" + signering.storeFile)
                storePassword signering.storePassword
                keyAlias signering.keyAlias
                keyPassword signering.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Appen distribueres kun fra IN-BASE (kontrolsum i QR-koden), aldrig via en butik.
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        resValues true
        buildConfig true   // BuildConfig.VERSION_NAME i rapporten til IN-BASE
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
